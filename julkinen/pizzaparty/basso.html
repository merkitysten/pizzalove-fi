<!DOCTYPE html>
<html lang="fi" data-peli="basso">
<head>
<meta charset="utf-8">
<!-- ⚠️ maximum-scale=1 + user-scalable=no ON TASSA TOINEN VYO, EI AINOA.
     Kaksoisnapautuksen zoomin torjuu ensisijaisesti peli.css:n
     touch-action (jokaisessa napautuskohteessa erikseen — se ei periydy).
     iOS Safari OHITTAA user-scalable=no:n tarkoituksella, mutta
     kotivalikosta avatussa standalone-tilassa se noudattaa sita — ja
     Android noudattaa aina. Peliin ei ole mitaan zoomattavaa. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- ⚠️ Selain EI VOI piilottaa omia palkkejaan. Ainoa tapa saada ne pois on
     että peli lisätään kotivalikkoon ("Lisää Koti-valikkoon"), jolloin nämä
     kaksi riviä avaavat sen ilman selainkromia. Silloin turva-alueet eivät
     enää ole nollia (iPhonessa ~34 pt alhaalla), ja asettelu ottaa sen
     huomioon env(safe-area-inset-*):lla. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- 🔵 KOTIVALIKOSTA AVATTUNA SIVU PIIRRETÄÄN TILAPALKIN ALLE (Marko 10.10.2026: «Saako tähän
     wpa:han tuon etiketin jatkumaan ylös saakka?»). black-translucent: tilapalkin teksti on
     valkoinen ja sivu jatkuu sen alle, joten aloitusruudun viiri ulottuu reunaan asti. Muissa
     näkymissä tilapalkin kohdalla on oranssi raita (yhteinen.css, body::after), ettei
     valkoinen kello katoa vaalealle pohjalle. Safari-selaimessa tällä ei ole vaikutusta. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- KOTIVALIKON KUVAKE
     ⚠️ iOS EI LUE manifestin ikoneita — se lukee vain apple-touch-iconin.
     Android lukee vain manifestin. Molemmat tarvitaan, eivätkä ne korvaa
     toisiaan.

     ⚠️ JA IKONILLA ON ?v=-LEIMA SAMASTA SYYSTÄ KUIN KOODILLA, mutta
     pahemmalla seurauksella: iOS pitää web-clip-ikoneista omaa
     välimuistia jonka avain on URL, eikä se tyhjenny yksityisestä
     tilasta, puhelimen uudelleenkäynnistyksestä eikä kuvakkeen
     poistamisesta. Jos kuva vaihtuu, LEIMA ON NOSTETTAVA — muuten
     muutos ei näy kenellekään joka on joskus käynyt sivulla.
     (Mitattu Norsussa 25.8.2026.)

     ⚠️ Tausta on umpinainen oranssi eikä läpinäkyvä: iOS laittaa
     läpinäkyvän alle MUSTAN. Eikä kuvaa pyöristetä itse — iOS
     pyöristää sen, ja valmiiksi pyöristetty saisi kaksi kulmaa. -->
<link rel="apple-touch-icon" href="kuvat/ikoni-180.png?v=20260910a">
<meta name="apple-mobile-web-app-title" content="Pizza Basso">
<link rel="manifest" href="manifest.json?v=20260910a">
<meta name="theme-color" content="#FAF6EE">
<title>Pizza Basso</title>
<!-- ⚠️ KOKEILU (6.10.2026): Pizza Basso omalla sivullaan, jotta Pizza Party ei voi
     rikkoutua. Ei hakukoneisiin ennen kuin Marko hyväksyy. -->
<meta name="robots" content="noindex">
<meta name="description" content="Pizza Love -korttipelin Pizza Basso selaimessa (kokeilu).">
<link rel="preload" href="fontit/poppins-700.woff2?v=20260911a" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fontit/d-din-condensed-700.woff2?v=20261009a" as="font" type="font/woff2" crossorigin>
<!-- Tulosruudun kuosi ja voittajan kuva esiladataan: ilman sitä puhelimessa
     näkyi hetken tyhjä pohja ja tyhjä ympyrä pallilla (mitattu 9.10.2026). -->
<link rel="preload" href="kuvat/kuosi.svg?v=20261006a" as="image">
<link rel="preload" href="kuvat/basso-syo.webp?v=20261006a" as="image">
<link rel="stylesheet" href="peli.css?v=20261019h">
<link rel="stylesheet" href="opetus.css?v=20261019g">
<link rel="stylesheet" href="yhteinen.css?v=20261020a">
<link rel="stylesheet" href="pelivalinta.css?v=20261019a">
<link rel="stylesheet" href="basso.css?v=20261019a">
</head>
<body>


<!-- PELI -->
<section id="peliRuutu" class="ruutu" hidden>
  <!-- ⚠️ PISTEET EIVAT OLE TASSA PALKISSA (Marko 10.9.2026). Ne olivat
       ylhaalla yksinpelissa ja alhaalla moninpelissa — sama tieto kahdessa
       eri paikassa riippuen pelimuodosta, ja ylhaalla ahtaasti. Nyt
       molemmat kayttavat samaa #pelaajarivi-rivia ruudun alalaidassa. -->
  <header class="palkki">
    <!-- Peruuta on vasemmassa ylakulmassa ja nakyy vain lausekevaiheessa:
         valintavaiheessa ei ole mitaan peruttavaa. -->
    <!-- 🔵 VALIKKO VASEMMASSA YLÄKULMASSA (Marko 9.10.2026: «asetukset / valikko
         vasemmassa yläkulmassa ja sitten se "jatka" -nappi oikeaan yläkulmaan, jolloin
         vain siellä olisi nappeja»). Sama miettivä Basso ≡-merkillä kuin lautapelin
         digiversiossa (apinavaaka/). Avaa valikon ja pysäyttää
         pelin kun tauko on sallittu — erillistä taukonappia ei enää ole. -->
    <button id="valikkoAuki" class="valikko-apina" data-ta="palkki.valikko" aria-label="Valikko"><img src="kuvat/basso-nappi.webp?v=20261009a" alt=""><span class="valikko-merkki" aria-hidden="true"><i></i><i></i><i></i></span></button>
    <!-- Taytepakka EI OLE ENAA ylapalkissa (Marko 19.10.2026: "nythan ne
         apinakortit on siella ruudun ylalaidassa hyvin pienena ja
         epaselvana" + "mahtuisiko ne apinakortit olemaan selka ylospain
         siina pizzakortin vierella, silloin ehka nakisi paremmin etta
         molempia kortteja on"). Se on nyt pizzakortin vieressa, ks.
         .pizza-alue alempana. -->
    <!-- Vain yhteispelissä (pelaaja.js täyttää): erän eteneminen ja omat
         pisteet ruudun yläreunaan (Marko 12.9.2026). Yksinpelissä tässä on
         täytepakka, ja pisteet ovat alarivin laatikoissa. -->
    <div id="verkkoPalkki" class="verkko-palkki" hidden>
      <span id="verkkoPalkkiKierros"></span>
      <b id="verkkoPalkkiPisteet" data-ta="pisteet.omat"></b>
    </div>
    <!-- Oikea yläkulma = toiminto. Pelissä se on «ota kortit takaisin», ja se näkyy
         vain laskun aikana (muulloin peruttavaa ei ole). -->
    <button id="alusta" class="kulmanappi" data-ta="palkki.alusta" aria-label="Ota kortit takaisin">&#8630;</button>
  </header>

  <div class="pelialue">
    <div class="pizza-alue">
      <!-- TAYTEPAKKA PIZZAKORTIN VIERESSA (Marko 19.10.2026).
           Mitattu ennen: pakka oli ylapalkissa 20 x 30 px:n sirupinona eli
           40 x 37 px kokonaisuudessaan - 3,5 % pizzakortin pinta-alasta
           tyopoydalla ja 6,9 % puhelimessa, 72 px pizzakortin ylapuolella
           eli kokonaan eri alueella ruutua. Ja se oli pelin AINOA
           korttikuva joka ei skaalaudu: kaikki muu johdetaan
           --kortti-lev:sta, tama oli kovakoodattu 20 x 30 px, joten isolla
           naytolla pakka kutistui suhteessa kaikkeen muuhun.
           Nyt se on oikean kokoinen korttipino pizzakortin vasemmalla
           puolella: kaksi pakkaa vierekkain, kuten poydalla.
           Pinon PAKSUUS kertoo yha maaran (sailytetty 9.9.2026:n
           perustelu), mutta sen varaama tila on VAKIO - muuten pizzakortti
           liikkuisi sivusuunnassa joka kerta kun kortti jaetaan. -->
      <div class="pakka-alue" id="taytepalkki" data-ta="palkki.taytteita" aria-label="Täytekortteja jäljellä"></div>
      <div class="pizza-kortti" id="pizzaKortti" role="button" tabindex="0" aria-disabled="true">
        <!-- ⚠️ EI ARVOMERKKIA PIZZAN PAALLE (Marko 11.9.2026): "Kortin
             numero nakyy kortissa itsessaan, niin sita ei tarvitse
             korostaa. Peli tuntuu liian laskemispelilta eika pizzan
             tekemiselta." Arvo on painettuna kortin kulmiin, ja
             ruudunlukijalle se on kuvan alt-tekstissa. -->
        <img id="pizzaKuva" alt="">
        <span id="pizzaSydan" class="pizza-sydan" hidden data-ta="pizza.sydan" aria-label="Sydänpizza, kaksi pistettä">♥2</span>
        <span id="pinoMerkki" class="pino-merkki" hidden></span>
      </div>
    </div>

    <div class="tyoalue">
      <div class="lasku-alue" id="laskuAlue" hidden>
          <div id="operaattorit" class="operaattorit">
      <button class="op" data-op="+">+</button>
      <button class="op" data-op="−">−</button>
      <button class="op" data-op="×">×</button>
      <button class="op" data-op="÷">÷</button>
      <button class="op" data-op="^">x<sup>y</sup></button>
      <button class="op op-log" data-op="log">log</button>
      <button id="sulut" class="op op-sulut">( )</button>
        </div>
      </div>

      <div id="kasi" class="kasi"></div>
    </div>
  </div>
  <!-- MONINPELI: pelaajanapit. Jokainen pelaaja on apina omalla varillaan
       (Markon tarkennus 9.9.2026: "pelaajakin on tavallaan apina").
       Nappi on se jolla vastausvuoro varataan, joten se on iso ja
       kaikkien ulottuvilla. Yksinpelissa rivi on piilossa. -->
  <div id="pelaajarivi" class="pelaajarivi" hidden></div>
  <div id="valahdys" class="valahdys"></div>
</section>

<!-- TULOS -->
<section id="tulosRuutu" class="ruutu" hidden>
  <!-- BASSO (Marko 6.10.2026): «ne jäljelle jääneet kortit pitäisi ensinnäkin
       nähdä. Ja nuo alanapit oli sekavat.» Rivit (pisteet + jääneet kortit +
       summa) piirtää basso.js. ▶ on heti tulosten alla, ja sen vieressä vain ⚙.
       ⌂ on piilossa: Bassolla ei ole omaa valikkoa, ja Partyn valikkoon vievä
       nappi heitti pelaajan pois pelistä. Elementti jää, ettei mikään viittaus
       siihen kaadu. -->
  <div class="tulos-pisteet" id="tulosPisteet"></div>
  <!-- Juoksukilpailu kohti pisterajaa (Marko 6.10.2026). basso.js piirtää. -->
  <div id="bassoKisa" class="basso-kisa tulos-laatikko"></div>

  <!-- 🔵 Marko 7.10.2026: «Asetukset ensinnäkin yläkulmaan ja tuon play-napin
       alta apina pois. Se on jäänne ajalta, kun pelissä ei ollut vielä apinan
       kuvia muualla.» ⚙ samaan paikkaan kuin pelinäkymässä, ▶ pelkkä nappi. -->
  <button id="tulosValikkoAuki" class="valikko-apina tulos-valikko" data-ta="palkki.valikko" aria-label="Valikko"><img src="kuvat/basso-nappi.webp?v=20261009a" alt=""><span class="valikko-merkki" aria-hidden="true"><i></i><i></i><i></i></span></button>
  <!-- ▶ oikeassa yläkulmassa (Marko 9.10.2026); verkossa sen tilalla ⏳. -->
  <div class="tulos-napit">
    <button id="uudelleen" class="jatka-nappi" data-ta="tulos.uudelleen" aria-label="Pelaa uudelleen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
    </button>
    <span id="bassoOdota" class="basso-odota" hidden role="status" data-ta="verkko.odota">⏳</span>
    <button id="tulosValikkoon" class="kuvake-nappi" hidden data-ta="valikko.alkuun" aria-label="Alkuvalikkoon">⌂</button>
  </div>
</section>


<!-- ASETUKSET — valikko, ei yksi lista.
     ⚠️ Sivulla ei ole selittävää tekstiä. Jokainen selitys on i-napin takana
     (.as-selite), koska teksti jota ei lueta vie tilan siltä valinnalta jota
     ollaan tekemässä (Marko 9.9.2026). Valikkorivi näyttää valitun arvon,
     mikä korvaa suurimman osan entisestä selitystekstistä. -->
<div id="asetusPeite" class="peite" hidden>
  <!-- ⚠️ `valikko-laatikko` tuo kuosin taustalle (Marko 15.10.2026: «Korttipelissäkin
       se rattaan takana oleva valikko on tällainen hailakan hiekan värinen»). -->
  <div class="asetus-laatikko valikko-laatikko" onclick="event.stopPropagation()">

    <!-- 0 · VALIKKO -->
    <section class="as-sivu" data-sivu="valikko">
      <div class="as-ylapalkki">
        <span class="as-kulma as-tyhja" aria-hidden="true"></span>
        <span class="as-nimi" data-t="as.otsikko">Asetukset</span>
        <button id="asetusKiinni" class="as-kulma" data-ta="as.sulje" aria-label="Sulje asetukset">&#10005;</button>
      </div>
      <!-- 🔵 ASETUKSET UUDELLEEN JÄRJESTETTYNÄ (Marko 9.10.2026, ks. index.html).
           Sama järjestys kuin Partyssa. Ihmispelaajat + Apinat → yksi «Pelaajat»-sivu,
           Lisätietoja → Laskutoimitusten i-napin taakse, Kauppaan → valikkoon,
           Takaisin sivustolle → alkuvalikossa jo. -->
      <nav class="as-valikko">
<!-- ⚠️ «Peli»-rivi poistettu 15.10.2026 (Marko: «se peli (kortti- vai
             lautapeli) pitäisi pystyä valitsemaan vain päävalikossa»). Sama
             päätös koskee lautapelin omaa valikkoa. Valitsin elää
             aloitusruudun ylänavigaatiossa. -->
        <button class="as-rivi" data-avaa="ihmiset">
          <span data-t="as.pelaajat">Pelaajat</span><b class="as-arvo" id="arvoIhmiset"></b></button>
        <button class="as-rivi" data-avaa="vari">
          <span data-t="as.vari">Hahmo</span><b class="as-arvo" id="arvoVari"></b></button>
        <button class="as-rivi" data-avaa="pisteraja">
          <span data-t="as.pisteraja">Pisteraja</span><b class="as-arvo" id="arvoPisteraja"></b></button>
        <button class="as-rivi" data-avaa="luvat">
          <span data-t="as.luvat">Laskutoimitukset</span><b class="as-arvo" id="arvoLuvat"></b></button>
        <button class="as-rivi" data-avaa="kieli">
          <span data-t="as.kieli">Kieli</span><b class="as-arvo" id="arvoKieli"></b></button>
        <!-- Verkkopelissä: perustaja lopettaa pelin kaikilta, muut poistuvat. -->
        <button class="as-rivi" id="asVerkkoLopeta" hidden>
          <span id="asVerkkoLopetaTeksti"></span><b class="as-arvo"></b></button>
        <!-- BASSO: Partyn rivit ovat piilossa mutta OLEMASSA — peli.js:n paivitaArvot
             ja kytkentävahti kirjoittavat niihin (arvot ja aikarajasäätimet). -->
        <button class="as-rivi" data-avaa="taso" hidden><b class="as-arvo" id="arvoTaso"></b></button>
        <button class="as-rivi" data-avaa="pelaajat" hidden><b class="as-arvo" id="arvoPelaajat"></b></button>
        <button class="as-rivi" data-avaa="tapa" hidden><b class="as-arvo" id="arvoTapa"></b></button>
        <button class="as-rivi" data-avaa="ajat" hidden><b class="as-arvo" id="arvoAjat"></b></button>
      </nav>
    </section>

    <!-- 1 · KIELI -->
    <section class="as-sivu" data-sivu="kieli" hidden>
      <div class="as-ylapalkki">
        <button class="as-kulma as-takaisin" data-ta="as.takaisin" aria-label="Takaisin">&#8249;</button>
        <span class="as-nimi" data-t="as.kieli">Kieli</span>
        <button class="as-kulma as-info" data-ta="as.info" aria-label="Mitä tämä tarkoittaa?">i</button>
      </div>
      <p class="as-selite" hidden data-t="selite.kieli"></p>
      <div id="kielet" class="as-lista"></div>
    </section>

    <!-- 2 · VAIKEUSASTE -->
    <section class="as-sivu" data-sivu="taso" hidden>
      <div class="as-ylapalkki">
        <button class="as-kulma as-takaisin" data-ta="as.takaisin" aria-label="Takaisin">&#8249;</button>
        <span class="as-nimi" data-t="as.taso">Vaikeusaste</span>
        <button class="as-kulma as-info" data-ta="as.info" aria-label="Mitä tämä tarkoittaa?">i</button>
      </div>
      <p class="as-selite" hidden data-t="selite.taso"></p>
      <div id="tasot" class="as-lista"></div>
    </section>

    <!-- 3 · PELAAJAT -->
    <section class="as-sivu" data-sivu="pelaajat" hidden>
      <div class="as-ylapalkki">
        <button class="as-kulma as-takaisin" data-ta="as.takaisin" aria-label="Takaisin">&#8249;</button>
        <span class="as-nimi" data-t="as.pelaajat">Pelaajat</span>
        <button class="as-kulma as-info" data-ta="as.info" aria-label="Mitä tämä tarkoittaa?">i</button>
      </div>
      <p class="as-selite" hidden data-t="selite.pelaajat"></p>
      <div id="pelaajat" class="as-lista"></div>
    </section>

    <!-- 4 · PELIMUOTO -->
    <section class="as-sivu" data-sivu="tapa" hidden>
      <div class="as-ylapalkki">
        <button class="as-kulma as-takaisin" data-ta="as.takaisin" aria-label="Takaisin">&#8249;</button>
        <span class="as-nimi" data-t="as.tapa">Pelimuoto</span>
        <button class="as-kulma as-info" data-ta="as.info" aria-label="Mitä tämä tarkoittaa?">i</button>
      </div>
      <p class="as-selite" hidden data-t="selite.tapa"></p>
      <div id="tavat" class="as-lista">
        <button class="as-valinta valittu" data-tapa="helppo" data-t="tapa.helppo">Helppo</button>
        <button class="as-valinta" data-tapa="vaikea" data-t="tapa.vaikea">Vaikeampi</button>
      </div>
    </section>

    <!-- 5 · AIKARAJAT — pelaajat saataa itse, ei koodissa (Marko 9.9.2026:
         "ettei tarvitse aina koodailla erikseen"). Oikeaa arvoa ei voi
         paatella; se on loydettava pelaamalla. -->
    <section class="as-sivu" data-sivu="ajat" hidden>
      <div class="as-ylapalkki">
        <button class="as-kulma as-takaisin" data-ta="as.takaisin" aria-label="Takaisin">&#8249;</button>
        <span class="as-nimi" data-t="as.ajat">Aikarajat</span>
        <button class="as-kulma as-info" data-ta="as.info" aria-label="Mitä tämä tarkoittaa?">i</button>
      </div>
      <p class="as-selite" hidden data-t="selite.ajat"></p>
      <div class="as-saatimet">
        <div class="as-saadin">
          <span data-t="aika.valinta">Korttien valinta</span>
          <div class="as-askeleet">
            <button class="as-askel" data-aika="valinta" data-askel="-1" data-ta="aika.vahemman" aria-label="Vähemmän aikaa">&#8722;</button>
            <b class="as-aika" id="arvoValinta">4 s</b>
            <button class="as-askel" data-aika="valinta" data-askel="1" data-ta="aika.enemman" aria-label="Enemmän aikaa">+</button>
          </div>
        </div>
        <div class="as-saadin">
          <span data-t="aika.lauseke">Laskun rakentaminen</span>
          <div class="as-askeleet">
            <button class="as-askel" data-aika="lauseke" data-askel="-1" data-ta="aika.vahemman" aria-label="Vähemmän aikaa">&#8722;</button>
            <b class="as-aika" id="arvoLauseke">6 s</b>
            <button class="as-askel" data-aika="lauseke" data-askel="1" data-ta="aika.enemman" aria-label="Enemmän aikaa">+</button>
          </div>
        </div>
      </div>
      <button id="ajatOletus" class="toinen-nappi" data-t="aika.oletus">Palauta oletukset</button>
    </section>


    <!-- BASSO · IHMISPELAAJAT samalla laitteella (Marko 6.10.2026) -->
    <section class="as-sivu" data-sivu="ihmiset" hidden>
      <div class="as-ylapalkki">
        <button class="as-kulma as-takaisin" data-ta="as.takaisin" aria-label="Takaisin">&#8249;</button>
        <span class="as-nimi" data-t="as.pelaajat">Pelaajat</span>
        <button class="as-kulma as-info" data-ta="as.info" aria-label="Mitä tämä tarkoittaa?">i</button>
      </div>
      <div class="as-selite" hidden><p data-t="selite.ihmiset"></p><p data-t="selite.apinat"></p></div>
      <div id="bassoIhmiset" class="as-lista"></div>
      <hr class="as-viiva">
      <div id="bassoApinat" class="as-lista"></div>
    </section>

    <!-- HAHMO (Marko 6.10.2026: «kaikilla pelaajilla olisi sekä hahmo että
         väri»). Yhteinen kaikille peleille 9.10.2026 alkaen: hahmot.js. -->
    <section class="as-sivu" data-sivu="vari" hidden>
      <div class="as-ylapalkki">
        <button class="as-kulma as-takaisin" data-ta="as.takaisin" aria-label="Takaisin">&#8249;</button>
        <span class="as-nimi" data-t="as.vari">Hahmo</span>
        <button class="as-kulma as-info" data-ta="as.info" aria-label="Mitä tämä tarkoittaa?">i</button>
      </div>
      <p class="as-selite" hidden data-t="selite.vari"></p>
      <!-- Useampi ihminen: ensin valitaan kenen väri, sitten väri. -->
      <div id="hahmoVariKuka" class="hahmo-kuka"></div>
      <!-- Nimi (valinnainen) valitulle pelaajalle — Marko 6.10.2026. -->
      <input id="hahmoNimiKentta" class="verkko-kentta hahmo-nimikentta" autocomplete="off"
             data-tp="bverkko.nimi" data-ta="bverkko.nimi">
      <div id="hahmoVarit" class="hahmo-varit"></div>
    </section>


    <!-- BASSO · PISTERAJA -->
