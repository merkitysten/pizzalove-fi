# Korttipelin säännöt asiakkaan pyytämälle kielelle (konekäännös).
# 🔵 Marko 16.11.2026: täysautomaattinen, yksi pyyntö kieltä kohden, kielilistaa
# ei ole (mikä tahansa kieli; oikealta vasemmalle kirjoitettavat torjutaan
# toistaiseksi). Uuden kirjoitusjärjestelmän ensimmäisen arkin Marko katsoo itse.
# Suunnitelma ja tunnisteet: Verkkosivut/ASIAKASKAANNOS.md (Markon kansio).
#
# Käynnistys: GitHub → Actions → «Konekäännös» → Run workflow → kielikoodi
# (BCP 47: pl, ja, ko, zh-Hans, zh-Hant, pt-BR, es-419 …).
# Myöhemmin sivuston nappi käynnistää saman ajon (workflow_dispatch).
#
# Claude API ilman avainta: Workload Identity Federation. ⚠️ ÄLÄ lisää
# ANTHROPIC_API_KEY-salaisuutta: se ohittaisi tämän.
name: Konekäännös

on:
  workflow_dispatch:
    inputs:
      kieli:
        description: 'Kielikoodi, esim. pl, ja, ko, zh-Hans, pt-BR'
        required: true
        type: string

permissions:
  contents: write   # tulos commitoidaan main-haaraan
  id-token: write   # OIDC-tunnus Claude API:a varten

# Yksi ajo kerrallaan: saman kielen toinen pyyntö näkee ensimmäisen tuloksen.
concurrency:
  group: konekaannos
  cancel-in-progress: false

jobs:
  kaanna:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KIELI: ${{ inputs.kieli }}
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01M561D21RCq6seGezU3CdMC
      ANTHROPIC_ORGANIZATION_ID: 810872cd-f15a-4813-983b-d3815c015434
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01RcJwQ5gztBgTRXJoNpbV9Y
      ANTHROPIC_WORKSPACE_ID: wrkspc_01FarhwKi8Utd6G67kxa9e9N
    steps:
      - uses: actions/checkout@v4

      - name: Tarkista kielikoodin muoto
        run: |
          if ! printf '%s' "$KIELI" | grep -Eq '^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8}){0,2}$'; then
            echo "::error::Virheellinen kielikoodi"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Työkalut
        run: |
          pip install -q langcodes language_data pillow playwright

      - name: Käännös (Claude API)
        id: kaannos
        run: |
          mkdir -p "$RUNNER_TEMP/liput" && cd "$RUNNER_TEMP/liput" && npm pack -s flag-icons@7.2.3 && tar xzf flag-icons-7.2.3.tgz
          cd "$GITHUB_WORKSPACE"
          LIPUT_LAHDE="$RUNNER_TEMP/liput/package/flags/1x1" python3 tyokalut/kaanna.py "$KIELI"

      - name: Fontit ja selain
        if: steps.kaannos.outputs.uusi == '1'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils fonts-noto-core fonts-noto-cjk
          python -m playwright install --with-deps chromium

      - name: VAG Rounded -viirikirjasin (salaisuudesta, ei repoon)
        if: steps.kaannos.outputs.uusi == '1'
        env:
          VAG_B64: ${{ secrets.VAG_FONTTI_B64 }}
        run: |
          if [ -n "$VAG_B64" ]; then
            printf '%s' "$VAG_B64" | base64 -d > "$RUNNER_TEMP/vag.ttf"
            echo "VAG_FONTTI=$RUNNER_TEMP/vag.ttf" >> "$GITHUB_ENV"
          else
            echo "::warning::Salaisuus VAG_FONTTI_B64 puuttuu — viirit Nunito Blackilla"
          fi

      - name: Arkki (PDF)
        if: steps.kaannos.outputs.uusi == '1'
        run: python3 koteloarkki.py "${{ steps.kaannos.outputs.koodi }}"

      - name: Julkaise
        if: steps.kaannos.outputs.uusi == '1'
        env:
          KOODI: ${{ steps.kaannos.outputs.koodi }}
        run: |
          PDF=$(python3 -c "import json,os; print(json.load(open('sisalto/konekaannos/' + os.environ['KOODI'] + '.json'))['kielet']['tiedosto'])")
          mkdir -p docs/pdf docs/kuvat/liput
          cp "julkinen/pdf/$PDF" "docs/pdf/$PDF"
          git add "sisalto/konekaannos/$KOODI.json" "julkinen/pdf/$PDF" "docs/pdf/$PDF"
          if [ -f "julkinen/kuvat/liput/$KOODI.svg" ]; then
            cp "julkinen/kuvat/liput/$KOODI.svg" "docs/kuvat/liput/$KOODI.svg"
            git add "julkinen/kuvat/liput/$KOODI.svg" "docs/kuvat/liput/$KOODI.svg"
          fi
          git config user.name "pizzalove-konekaannos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Konekäännös: $KOODI (ei tarkastettu)"
          git push
          echo "::notice::Valmis: https://pizzalove.fi/pdf/$PDF"
