# Korttipelin säännöt asiakkaan pyytämälle kielelle (konekäännös).
# 🔵 Marko 16.11.2026: «tämän kaiken pitää tapahtua automaattisesti ilman
# minulta vaadittavia toimintoja». Yksi ajo tekee käännöksen, kielen oman sivun
# (pizzalove.fi/xx/card-game) ja sääntöarkin ja julkaisee ne.
# Kielilistaa ei ole (BCP 47: pl, ja, ko, zh-Hans, pt-BR, ar …). Yksi pyyntö
# kieltä kohden. ⚠️ Oikealta vasemmalle kirjoitettavat torjuttiin 19.11.2026
# asti; portti poistettiin, kun *vain tekstin suunta* oli toteutettu ja
# vartioitu (tyokalut/rtlkoe.py). Arabian kirjasimet tulevat `fonts-noto-core`-
# paketista, jonka alla oleva askel jo asentaa.
#
# Tulokset tallennetaan omaan haaraansa `konekaannokset`, EI main-haaraan:
# näin Markon GitHub Desktop ei koskaan vaadi Pullia käännösten takia.
# Julkaisu (julkaise.yml) kokoaa sivuston main-haarasta + tästä haarasta.
#
# Käynnistys: sivuston «Yes, please» -nappi (palvelin/kaannospyynto.php) tai
# GitHub → Actions → Konekäännös → Run workflow. Kieli «kaikki» = tee kaikkien
# konekäännösten arkit uudelleen (ei uutta käännöstä), kun arkin pohja muuttuu.
#
# 🔵 Marko 22.11.2026: «kun asiakas tilaa jonkin kielen, niin se sinne tulee
# ennemmin tai myöhemmin, mutta tulee kumminkin.» Siksi kolmas kieli «jono»,
# joka on myös ajastetun ajon oma: se EI käännä mitä tahansa, vaan vie
# loppuun sen mikä jäi kesken — kääntämättä jääneen tilauksen (jono) ja
# puuttuvan arkin (tiedostoista). Jos mikään ei ole kesken, ajo ei tee
# eikä julkaise mitään. Ks. tyokalut/jono.py.
#
# Claude API ilman avainta: Workload Identity Federation. ⚠️ ÄLÄ lisää
# ANTHROPIC_API_KEY-salaisuutta: se ohittaisi tämän.
name: Konekäännös
# 📐 Ajon nimeen kieli (Marko 16.11.2026). Kaksi syytä: Actions-listalta näkee
# suoraan minkä kielen ajo kaatui — hindin syytä etsittiin lokeista, koska
# kaikki ajot olivat nimeltään pelkkä «Konekäännös» — ja palvelin
# (palvelin/kaannospyynto.php) lukee tästä nimestä, mitkä kielet ovat työn
# alla, eikä sen tarvitse tallettaa sitä itse.
run-name: Konekäännös ${{ inputs.kieli || 'jono' }}${{ inputs.toistokoe && ' (toistokoe)' || '' }}

on:
  workflow_dispatch:
    inputs:
      kieli:
        description: 'Kielikoodi (pl, ja, ko, zh-Hans, pt-BR …) tai «kaikki» = arkit uudelleen'
        required: true
        type: string
      toistokoe:
        description: 'Toistettavuusmittaus: käännä sama kieli uudelleen ja vertaa. MAKSAA yhden käännöksen, EI tallenna mitään.'
        required: false
        default: false
        type: boolean
  # Kesken jäänyt tilaus viedään loppuun joka yö. ⚠️ Ei uusi käännös
  # kysymättä: ajo kääntää vain sen minkä joku on pyytänyt ja jonka
  # kääntäminen EI onnistunut (konekaannos-jono.json haarassa
  # konekaannokset), enintään yhden kielen kerrallaan.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write   # tulos haaraan konekaannokset
  id-token: write   # OIDC-tunnus Claude API:a ja Pages-julkaisua varten
  pages: write

concurrency:
  group: konekaannos
  cancel-in-progress: false

jobs:
  kaanna:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      uusi: ${{ steps.tulos.outputs.uusi }}
    env:
      KIELI: ${{ inputs.kieli || 'jono' }}
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01M561D21RCq6seGezU3CdMC
      ANTHROPIC_ORGANIZATION_ID: 810872cd-f15a-4813-983b-d3815c015434
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01RcJwQ5gztBgTRXJoNpbV9Y
      ANTHROPIC_WORKSPACE_ID: wrkspc_01FarhwKi8Utd6G67kxa9e9N
    steps:
      - uses: actions/checkout@v4

      - name: Tarkista kielikoodin muoto
        run: |
          if [ "$KIELI" != "kaikki" ] && [ "$KIELI" != "jono" ] && ! printf '%s' "$KIELI" | grep -Eq '^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8}){0,2}$'; then
            echo "::error::Virheellinen kielikoodi"; exit 1
          fi

      - name: Hae aiemmat konekäännökset (haara konekaannokset)
        run: bash tyokalut/konekaannokset-haara.sh hae

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Työkalut
        run: pip install -q langcodes language_data pillow playwright

      # ⚠️ OMA ASKEL, EI käännösaskeleen sisällä (Marko 16.11.2026). Tässä luki
      # npm pack käännösaskeleessa, jossa on «if: kieli != kaikki» — eli
      # «kaikki»-ajossa lippulähdettä ei ladattu lainkaan, ja täydennysaskel jäi
      # joka tapauksessa ilman LIPUT_LAHDE:a. Nyt molemmat askeleet näkevät sen
      # GITHUB_ENVin kautta, joten myös vanha käännös voi saada puuttuvan lippunsa.
      - name: Lippulähde (flag-icons)
        run: |
          mkdir -p "$RUNNER_TEMP/liput" && (cd "$RUNNER_TEMP/liput" && npm pack -s flag-icons@7.2.3 && tar xzf flag-icons-7.2.3.tgz)
          echo "LIPUT_LAHDE=$RUNNER_TEMP/liput/package/flags/1x1" >> "$GITHUB_ENV"

      # 🔵 Marko 19.11.2026: «Tee se toistettavuusmittaus.»
      # ⚠️ OMA HAARANSA, joka EI tallenna eikä julkaise: mittaus kysyy mikä
      # kohta vaihtelee ajosta toiseen, eikä sen tulos saa korvata käännöstä
      # joka on jo sivulla ja arkissa. Ajo paattyy tahan.
      - name: Toistettavuusmittaus (Claude API, EI tallenna)
        if: inputs.toistokoe
        run: python3 tyokalut/kaanna.py --toisto "$KIELI"

      # Yksi paikka, joka vastaa kysymykseen «käännetäänkö tässä ajossa, ja
      # mitä». ⚠️ Ajastettu ajo ei tiedä kieltä ennen kuin jono on luettu, ja
      # jono voi olla tyhjä — silloin KAANNA on tyhjä eikä yhtään API-kutsua
      # tehdä. Ilman tätä askelta ehto olisi kirjoitettu kolmeen `if`-riviin.
      - name: Mitä käännetään
        run: |
          case "$KIELI" in
            kaikki) kaanna="" ;;
            jono)   kaanna="$(python3 tyokalut/jono.py seuraava)" ;;
            *)      kaanna="$KIELI" ;;
          esac
          echo "KAANNA=$kaanna" >> "$GITHUB_ENV"
          echo "Käännetään: ${kaanna:-(ei mitään — vain arkit)}"
          python3 tyokalut/jono.py tila

      # ⚠️ `continue-on-error`: epäonnistunut käännös EI saa pysäyttää ajoa,
      # koska sen jälkeen on kaksi asiaa jotka on vielä tehtävä — tilaus
      # jonoon ja puuttuvat arkit. Ajo merkitään punaiseksi vasta lopussa
      # («Epäonnistuiko käännös?»), samalla kuviolla kuin arkit 19.11.2026.
      - name: Käännös (Claude API)
        id: kaannos
        if: ${{ env.KAANNA != '' && !inputs.toistokoe }}
        continue-on-error: true
        run: python3 tyokalut/kaanna.py "$KAANNA"

      # 🔵 Marko 22.11.2026: tilaus ei katoa. Yksi kutsu osaa molemmat suunnat:
      # käännös levyllä → rivi pois jonosta, ei käännöstä → jonoon ja laskuri
      # kasvaa. ⚠️ `!cancelled()`, jotta kaatunut käännös ehtii jonoon.
      - name: Kielijono (tilaus ei katoa)
        if: ${{ !cancelled() && env.KAANNA != '' && !inputs.toistokoe }}
        run: python3 tyokalut/jono.py paivita "$KAANNA" "ajo ${{ github.run_number }} - käännös ${{ steps.kaannos.outcome }}"

      # ⚠️ KÄÄNNÖS TALTEEN HETI, ennen raskaita askeleita.
      # 📐 Mitattu 16.11.2026: hindin käännös ONNISTUI ja läpäisi tarkistuksen,
      # mutta ajo kaatui vasta arkin teossa — ja koska tallennus oli vasta sen
      # jälkeen, valmis käännös katosi kokonaan. Hinta noin dollari, tulos nolla,
      # ja seuraava yritys maksaa saman uudelleen. Nyt JSON menee haaraan heti;
      # arkki ja PDF lisätään samaan haaraan ajon lopuksi. Jos loppu kaatuu,
      # käännös on silti tallessa, ja seuraava «kaikki»-ajo tekee arkin ilmaiseksi.
      - name: Tallenna käännös heti (ennen arkkeja)
        if: steps.kaannos.outputs.uusi == '1' && !inputs.toistokoe
        run: bash tyokalut/konekaannokset-haara.sh tallenna "${{ steps.kaannos.outputs.koodi }}" "$KIELI (käännös talteen)"

      # Aiemmista käännöksistä puuttuvat myöhemmin lisätyt osat (valikko ja napit
      # «ui», tiedostokoko «koko», sekä puuttuva lippu). Ei uusi käännös eikä
      # kuluta päiväkattoa; lippu ei vaadi API-kutsua lainkaan.
      - name: Täydennä aiemmat konekäännökset
        id: taydennys
        if: ${{ !inputs.toistokoe }}
        run: python3 tyokalut/kaanna.py --taydenna

      - name: Mitä tehdään
        id: tulos
        # ⚠️ Toistokoe-ajossa ei tehdä mitään jatkoa: ilman tätä «kaikki» +
        # toistokoe olisi rakentanut arkit uudelleen mittauksen sivutuotteena.
        if: ${{ !inputs.toistokoe }}
        run: |
          if [ "$KIELI" = "kaikki" ]; then
            KOODIT=$(ls sisalto/konekaannos/*.json 2>/dev/null | xargs -n1 basename | sed 's/\.json$//' | tr '\n' ' ')
            echo "koodit=$KOODIT" >> "$GITHUB_OUTPUT"; echo "uusi=1" >> "$GITHUB_OUTPUT"
          elif [ "$KIELI" = "jono" ]; then
            # ⚠️ Ajastettu ajo tekee VAIN sen mikä on kesken: arkki jota ei ole
            # (tai joka on katkennut) ja tässä ajossa syntynyt käännös. Jos
            # mikään ei ole kesken, uusi=0 eikä julkaisua tehdä — tyhjä yö ei
            # saa maksaa Pages-julkaisua eikä roskacommittia haaraan.
            KOODIT="$(python3 tyokalut/jono.py puuttuvat | tr '\n' ' ')${{ steps.taydennys.outputs.taydennetty }} "
            if [ "${{ steps.kaannos.outputs.uusi }}" = "1" ]; then KOODIT="$KOODIT ${{ steps.kaannos.outputs.koodi }}"; fi
            if [ -n "$(printf '%s' "$KOODIT" | tr -d ' ')" ]; then u=1; else u=0; fi
            echo "Kesken: ${KOODIT:-(ei mitään)}"
            echo "koodit=$KOODIT" >> "$GITHUB_OUTPUT"; echo "uusi=$u" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.kaannos.outputs.uusi }}" = "1" ] || [ -n "${{ steps.taydennys.outputs.taydennetty }}" ]; then
            echo "koodit=${{ steps.kaannos.outputs.koodi }} ${{ steps.taydennys.outputs.taydennetty }}" >> "$GITHUB_OUTPUT"
            echo "uusi=1" >> "$GITHUB_OUTPUT"
          else
            echo "koodit=" >> "$GITHUB_OUTPUT"; echo "uusi=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Fontit ja selain
        if: steps.tulos.outputs.uusi == '1'
        run: |
          # ⚠️ Askel on mitattava, koska se on ylivoimaisesti hitain ja sen
          # kesto vaihtelee: 29 s … 2188 s (19.11.2026). Ilman erittelyä ei
          # tiedä kumpi puoli on hidas.
          alku=$SECONDS
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils fonts-noto-core fonts-noto-cjk
          echo "apt: $((SECONDS - alku)) s"
          # Chrome on ajurikuvassa valmiina (Google Chrome 157). Ladataan
          # selain vain jos sitä EI ole — aiemmin se ladattiin joka ajossa.
          alku=$SECONDS
          if command -v google-chrome >/dev/null; then
            echo "Chrome valmiina: $(google-chrome --version)"
          else
            python -m playwright install --with-deps chromium
          fi
          echo "selain: $((SECONDS - alku)) s"
          # ⚠️ Savutesti TÄSSÄ eikä ensimmäisen arkin sisällä. 📐 22.11.2026:
          # viron ajossa selain kaatui vasta QR-lukukokeessa 17 s myöhemmin,
          # ja kaatunut arkki ohitti koko `julkaise`-työn — käännös oli
          # valmis mutta sivua ei julkaistu. Samalla tarkistetaan että
          # käynnistys on yhdessä paikassa: neljäs `launch`-rivi on juuri se
          # joka jää muuntamatta.
          python3 tyokalut/selainkoe.py --vaadi-savu

      - name: VAG Rounded -viirikirjasin (salaisuudesta, ei repoon)
        if: steps.tulos.outputs.uusi == '1'
        env:
          VAG_B64: ${{ secrets.VAG_FONTTI_B64 }}
        run: |
          if [ -n "$VAG_B64" ]; then
            printf '%s' "$VAG_B64" | base64 -d > "$RUNNER_TEMP/vag.ttf"
            echo "VAG_FONTTI=$RUNNER_TEMP/vag.ttf" >> "$GITHUB_ENV"
          else
            echo "::warning::Salaisuus VAG_FONTTI_B64 puuttuu — viirit Nunito Blackilla"
          fi

      # ⚠️ YKSI KIELI EI SAA KAATAA MUITA. 📐 Mitattu 19.11.2026: «kaikki»-ajo
      # kuoli arabian arkkiin, ja koska `run: |` ajaa bashin -e-lipulla ja `ar`
      # on aakkosissa ensimmäinen, yksikään muu arkki ei syntynyt eikä mitään
      # tallennettu. Kuusi kieltä jäi ilman uutta kirjasinta yhden takia.
      # Nyt jokainen kieli ajetaan loppuun, onnistuneet TALLENNETAAN, ja ajo
      # merkitään punaiseksi vasta sen jälkeen.
      - name: Sivusto (kielen oma sivu) ja arkit
        id: arkit
        if: steps.tulos.outputs.uusi == '1'
        run: |
          python3 rakenna.py
          virheita=0
          for k in ${{ steps.tulos.outputs.koodit }}; do
            if python3 koteloarkki.py "$k" > "$RUNNER_TEMP/arkki-$k.log" 2>&1; then
              cat "$RUNNER_TEMP/arkki-$k.log"
            else
              cat "$RUNNER_TEMP/arkki-$k.log"
              # ⚠️ Syy HUOMAUTUKSIIN, ei vain lokiin: lokin lukeminen vaatii
              # ylläpito-oikeudet, huomautukset (annotations) ovat julkisen
              # repon API:ssa kenen tahansa luettavissa. 📐 Mitattu 19.11.2026:
              # arabian arkin kaatumisesta jäi näkyviin vain «Process completed
              # with exit code 1», eikä syytä voinut tutkia sieltä missä se
              # tapahtui.
              echo "::error::arkki $k epäonnistui"
              grep -E '^(🔴|ℹ️|   )' "$RUNNER_TEMP/arkki-$k.log" | head -14 \
                | while IFS= read -r rivi; do echo "::error::$k $rivi"; done
              # ⚠️ KOLME TILAA, EI KAHTA (Marko 22.11.2026, ja 18.11.2026:
              # «puuttuva nappi on oikea signaali, väärä sisältö ei ole»).
              # koteloarkki.py kirjoittaa PDF:n ENNEN omia kokeitaan, joten
              # 🔴-tuomion saanut arkki on levyllä ja lähtisi muuten haaraan
              # ja sivulle. Se poistetaan tässä — mutta ehjä arkki jonka
              # perässä vain KOE kaatui (viro) jää, koska arkissa ei ole
              # vikaa. Puuttuva arkki tehdään uudelleen seuraavassa ajossa,
              # eikä se maksa mitään.
              python3 tyokalut/jono.py arkki "$k" "$RUNNER_TEMP/arkki-$k.log"
              virheita=$((virheita + 1))
            fi
          done
          echo "virheita=$virheita" >> "$GITHUB_OUTPUT"

      # ⚠️ EI enää `uusi == '1'`: jono on tiedosto tässä haarassa, ja juuri se
      # ajo jossa käännös EI onnistunut on se jonka tilaus on muistettava.
      # Skripti päättyy itse «Ei muutoksia» -riviin, jos mitään ei muuttunut.
      - name: Tallenna haaraan konekaannokset
        if: ${{ !cancelled() && !inputs.toistokoe }}
        run: bash tyokalut/konekaannokset-haara.sh tallenna "${{ steps.tulos.outputs.koodit }}" "$KIELI"

      # Punainen vasta tässä, jotta tilaus ehtii jonoon ja arkit tallentua.
      - name: Epäonnistuiko käännös?
        if: ${{ !cancelled() && steps.kaannos.outcome == 'failure' }}
        run: |
          echo "🔴 Käännös ($KAANNA) ei onnistunut — kieli on jonossa (konekaannos-jono.json"
          echo "   haarassa konekaannokset) ja yritetään uudelleen seuraavassa yöajossa."
          exit 1

      # Punainen vasta tässä, jotta onnistuneet arkit ehtivät tallentua.
      - name: Epäonnistuiko jokin arkki?
        if: always() && steps.arkit.outputs.virheita != '' && steps.arkit.outputs.virheita != '0'
        run: |
          echo "🔴 ${{ steps.arkit.outputs.virheita }} arkkia epäonnistui — ks. lokin «::error::arkki» -rivit."
          exit 1

  julkaise:
    needs: kaanna
    # 🔵 Marko 22.11.2026: «Älä estä julkaisua, tee se yhden rivin muutos.»
    # 📐 Syy mitattiin ajossa #25: viron arkki VALMISTUI, ja vain sen perään
    # ajettava QR-lukukoe kaatui — mutta koska punainen arkki punaa koko työn,
    # paljas `needs: kaanna` OHITTI tämän julkaisun. Valmis käännös makasi
    # haarassa, eikä ulospäin näkynyt muuta kuin «1 arkkia epäonnistui».
    # ⚠️ Ehto `uusi == '1'` JÄÄ — se on se joka kertoo, että käännös todella
    # tallentui haaraan. Jos ajo kaatuu ennen sitä, julkaistavaa ei ole.
    # ⚠️ `!cancelled()` eikä `always()`: KÄSIN keskeytetty ajo ei julkaise.
    if: ${{ !cancelled() && needs.kaanna.outputs.uusi == '1' }}
    uses: ./.github/workflows/julkaise.yml
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
